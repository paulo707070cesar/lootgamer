name: Deploy Loot Gamer (Hostinger)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lootgamer
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar no Hostinger
    runs-on: ubuntu-latest
    env:
      # Nunca versione credenciais: configure em Settings > Secrets and variables > Actions
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validar segredos
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Configure os secrets FTP_SERVER, FTP_USERNAME e FTP_PASSWORD."
            exit 1
          fi
          echo "Secrets OK"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Não envie coisas de desenvolvimento/segredos
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/config/config.php
            **/logs/**
            **/data/sessions/**
            **/data/cache/**
            **/data/backups/**
            **/admin-legacy/**
            **/*.zip
            **/README.md
            **/.gitattributes
            **/database.sql
            **/install.php
